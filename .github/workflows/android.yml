name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['web/**', 'scripts/android.ps1', '.github/workflows/android.yml']
  pull_request:
    paths: ['web/**', 'scripts/android.ps1', '.github/workflows/android.yml']
jobs:
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
        working-directory: web
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/android.ps1 -Action build
      - uses: actions/upload-artifact@v4
        with: { name: plan-cabin-android-debug, path: android-artifacts/*-debug.apk, if-no-files-found: error }
