name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B test
        working-directory: backend
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: node scripts/verify-release.mjs
      - run: node --test scripts/switch-public-entry.test.mjs
      - run: node --test scripts/formal-release.test.mjs scripts/windows-public-release.test.mjs scripts/client-static-config.test.mjs scripts/retain-windows-releases.test.mjs
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
  browser-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: mvn -B -DskipTests -Dplan.build.directory=target-acceptance package
        working-directory: backend
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: node scripts/check-pwa.mjs
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      # Traces can contain test session tokens; do not upload them to public artifacts.
