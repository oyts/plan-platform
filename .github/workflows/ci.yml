name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Test scope (full only for major releases or explicit investigation)'
        type: choice
        options: [affected, full]
        default: affected
env:
  TEST_SCOPE: ${{ github.event.inputs.scope || 'affected' }}
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Selected backend tests
        shell: pwsh
        run: |
          . ./scripts/release-test-scope.ps1
          $plan = Get-ReleaseTestScope
          if ($env:TEST_SCOPE -eq 'full') { mvn -B -f backend/pom.xml test }
          elseif (@($plan.backend).Count) { mvn -B -f backend/pom.xml "-Dtest=$($plan.backend -join ',')" test }
          else { mvn -B -f backend/pom.xml -DskipTests package }
          if ($LASTEXITCODE -ne 0) { throw 'Selected backend validation failed.' }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: node scripts/verify-release.mjs
      - run: python3 scripts/test-ai-mysql-acceptance.py
      - run: python3 scripts/test-runtime-telemetry.py && python3 scripts/test-planning-rollback.py
      - run: python3 scripts/test-release-drill.py && python3 scripts/test-metrics-release.py
      - run: node --test scripts/runtime-metrics-config.test.mjs
      - run: sh -n scripts/ai-candidate.sh && sh -n scripts/configure-ai-secret.sh
      - run: node --test scripts/switch-public-entry.test.mjs
      - run: node --test scripts/formal-release.test.mjs scripts/windows-public-release.test.mjs scripts/client-static-config.test.mjs scripts/retain-windows-releases.test.mjs
      - run: npm run build
        working-directory: web
      - name: Selected frontend tests
        shell: pwsh
        run: |
          . ./scripts/release-test-scope.ps1
          Invoke-ReleaseFrontendTests $env:TEST_SCOPE
  browser-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Build selected browser fixture
        shell: pwsh
        run: |
          . ./scripts/release-test-scope.ps1
          $plan = Get-ReleaseTestScope
          $target = if ($env:TEST_SCOPE -eq 'affected' -and $plan.browserBackendTarget) { $plan.browserBackendTarget } else { 'target-acceptance' }
          mvn -B -f backend/pom.xml -DskipTests "-Dplan.build.directory=$target" package dependency:build-classpath "-Dmdep.outputFile=$target/classpath.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Selected browser fixture build failed.' }
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: node scripts/check-pwa.mjs
        working-directory: web
      - name: Selected browser tests
        shell: pwsh
        run: |
          . ./scripts/release-test-scope.ps1
          $plan = Get-ReleaseTestScope
          if ($env:TEST_SCOPE -eq 'full') { npm --prefix web run test:e2e }
          elseif (@($plan.browser).Count) {
            $selected = @('--prefix', 'web', 'run', 'test:e2e', '--') + @($plan.browser)
            if ($plan.browserConfig) { $selected += @('--config', $plan.browserConfig) }
            & npm @selected
          }
          else { Write-Host 'No browser business changes selected.'; exit 0 }
          if ($LASTEXITCODE -ne 0) { throw 'Selected browser validation failed.' }
      # Traces can contain test session tokens; do not upload them to public artifacts.
