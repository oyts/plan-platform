spring:
  datasource:
    url: jdbc:h2:mem:plan_platform_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
app:
  version: 0.1.4
  cors-allowed-origins: http://localhost:43128
  jwt:
    issuer: plan-platform-test
    secret: test-secret-that-is-definitely-longer-than-32-bytes
    access-token-minutes: 15
    refresh-token-days: 30
  security:
    registration-enabled: true
    refresh-cookie-name: plan_refresh
    refresh-cookie-secure: false
    refresh-cookie-same-site: Strict
    max-login-attempts: 3
    login-window-seconds: 900
    max-sessions: 5
    invitation-enabled: true
    invitation-hours: 168
    email-verification-enabled: false
    email-verification-minutes: 60
    bootstrap-admin-email:
