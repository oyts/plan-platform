spring:
  application:
    name: plan-platform-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  version: 0.1.7
  android-updates:
    enabled: ${ANDROID_UPDATE_ENABLED:false}
    directory: ${ANDROID_UPDATE_DIRECTORY:}
    package-name: ${ANDROID_UPDATE_PACKAGE:cn.zijun701.plan.app}
  bootstrap:
    token-hash: ${BOOTSTRAP_ADMIN_TOKEN_HASH:}
    expires-at: ${BOOTSTRAP_ADMIN_EXPIRES_AT:}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    issuer: plan-platform
    secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
  security:
    registration-enabled: ${REGISTRATION_ENABLED:false}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:plan_refresh}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    login-window-seconds: ${LOGIN_WINDOW_SECONDS:900}
    max-sessions: ${MAX_SESSIONS:5}
    password-reset-enabled: ${PASSWORD_RESET_ENABLED:false}
    password-reset-minutes: ${PASSWORD_RESET_MINUTES:60}
    invitation-enabled: ${INVITATION_ENABLED:true}
    invitation-hours: ${INVITATION_HOURS:168}
    email-verification-enabled: ${EMAIL_VERIFICATION_ENABLED:false}
    email-verification-minutes: ${EMAIL_VERIFICATION_MINUTES:60}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  public-url: ${APP_PUBLIC_URL:http://localhost:43128}
  mail-from: ${MAIL_FROM:}
