apply plugin: 'com.android.application'

def nativeRegression = System.getenv('PLAN_NATIVE_REGRESSION') == '1'
def publicRelease = System.getenv('PLAN_PUBLIC_RELEASE') == '1'
if (nativeRegression && publicRelease) throw new GradleException('Regression and public release identities cannot be combined.')
if (publicRelease && ['PLAN_ANDROID_TEST_UPDATE_CERT','PLAN_ANDROID_TEST_VERSION','PLAN_ANDROID_TEST_VERSION_CODE'].any { System.getenv(it) }) throw new GradleException('Formal release cannot include lab trust or test version overrides.')
if (nativeRegression && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) throw new GradleException('Regression packages are debug-only.')
gradle.taskGraph.whenReady { graph ->
    if (nativeRegression && graph.allTasks.any { it.name.toLowerCase().contains('release') }) throw new GradleException('Regression packages cannot run release tasks, including aggregate builds.')
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && (!publicRelease || !System.getenv('PLAN_ANDROID_KEYSTORE'))) throw new GradleException('Release tasks require PLAN_PUBLIC_RELEASE=1 and the formal keystore.')
    if (publicRelease && graph.allTasks.any { it.name == 'assembleDebug' }) throw new GradleException('Formal identity cannot produce a debug APK.')
}

android {
    buildFeatures { buildConfig true }
    namespace = "cn.zijun701.plan.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId publicRelease ? "cn.zijun701.plan.app" : (nativeRegression ? "cn.zijun701.plan.mobile.regression" : "cn.zijun701.plan.mobile")
        manifestPlaceholders = [planAppLabel: nativeRegression ? '计划舱回归测试' : '@string/app_name']
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('PLAN_ANDROID_TEST_VERSION_CODE') ?: '8')
        versionName System.getenv('PLAN_ANDROID_TEST_VERSION') ?: "0.1.4"
        buildConfigField 'String', 'PLAN_UPDATE_URL', groovy.json.JsonOutput.toJson(nativeRegression ? '' : (System.getenv('PLAN_ANDROID_UPDATE_URL') ?: 'https://plan.zijun701.cn/client-updates/android/latest.json'))
        buildConfigField 'String', 'PLAN_TEST_UPDATE_CERT', groovy.json.JsonOutput.toJson(System.getenv('PLAN_ANDROID_TEST_UPDATE_CERT') ?: '')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            storeFile file('../../../.android-signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (System.getenv('PLAN_ANDROID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('PLAN_ANDROID_KEYSTORE'))
                storePassword System.getenv('PLAN_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('PLAN_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('PLAN_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('PLAN_ANDROID_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
}

if (System.getenv('PLAN_ANDROID_TEST_UPDATE_CERT')) {
    if (!(System.getenv('PLAN_ANDROID_UPDATE_URL') ?: '').startsWith('https://127.0.0.1:43133/')) throw new GradleException('Test TLS trust is restricted to the loopback update lab.')
    if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) throw new GradleException('Test TLS certificates cannot be included in release APKs.')
}
if ((System.getenv('PLAN_ANDROID_TEST_VERSION') || System.getenv('PLAN_ANDROID_TEST_VERSION_CODE')) && !System.getenv('PLAN_ANDROID_TEST_UPDATE_CERT')) throw new GradleException('Version overrides are only allowed in the isolated update lab.')

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
