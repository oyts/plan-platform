server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ { proxy_pass http://backend:8080/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /actuator/ { proxy_pass http://backend:8080/actuator/; }
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /downloads/manifest.json { add_header Cache-Control "no-store"; try_files $uri =404; }
  location /downloads/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
