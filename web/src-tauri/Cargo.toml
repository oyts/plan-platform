[package]
name = "plan-platform-desktop"
version = "0.1.9"
description = "计划舱 Windows 客户端"
edition = "2021"
rust-version = "1.99"

[lib]
name = "plan_platform_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-regression = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "~2.13.1"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies"] }
updater-http = { package = "reqwest", version = "~0.13.5", default-features = false, features = ["rustls-no-provider"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["sync"] }
sha2 = "0.10"
url = "2"
cookie = "0.18"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rustls = { version = "~0.23.45", default-features = false, features = ["ring"] }
