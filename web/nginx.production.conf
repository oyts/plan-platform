server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;
  # Host Nginx is the HTTPS terminator; this port is loopback-only.
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /actuator/health { proxy_pass http://backend:8080/actuator/health; }
  location /actuator/ { return 404; }
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /downloads/manifest.json { add_header Cache-Control "no-store"; try_files $uri =404; }
  location /downloads/ { try_files $uri =404; }
  location ~ ^/client-updates/(windows|android)/latest\.json$ { add_header Cache-Control "no-store"; try_files $uri =404; }
  location /client-updates/ { try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
