openapi: 3.0.3
info:
  title: Plan Platform API
  version: 0.1.0
  description: 多用户计划、主线、计时与统计 API。除认证入口外，所有接口均需 Bearer Access Token。客户端可为写操作提供 X-Idempotency-Key；相同用户、键和请求内容在 24 小时内会重放已完成响应。
servers:
  - url: /api
paths:
  /auth/config:
    get:
      summary: 获取公开账号功能开关
      responses: { '200': { description: 功能开关；planRestDaysEnabled 为 true 表示支持每周休息日配置, content: { application/json: { schema: { type: object, properties: { planRestDaysEnabled: { type: boolean } } } } } } }
  /auth/register:
    post:
      summary: 注册账号（服务端开启注册时）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '201': { description: 已注册 } }
  /auth/login:
    post:
      summary: 邮箱密码登录并写入 HttpOnly 刷新 Cookie
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { description: 已登录 } }
  /auth/refresh:
    post:
      summary: 使用刷新 Cookie 轮换令牌
      responses: { '200': { description: 新 Access Token } }
  /auth/me:
    get: { summary: 获取当前资料, security: [{ bearerAuth: [] }], responses: { '200': { description: 当前用户 } } }
    patch:
      summary: 修改当前用户显示名称
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileRequest' } } } }
      responses: { '200': { description: 已更新 } }
  /auth/password:
    post:
      summary: 验证当前密码后修改密码并撤销全部刷新会话
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePasswordRequest' } } } }
      responses: { '204': { description: 密码已更新 } }
  /auth/password-reset/request:
    post:
      summary: 请求一次性密码重置邮件；始终返回 204 以避免邮箱枚举
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses: { '204': { description: 已受理 } }
  /auth/password-reset/confirm:
    post:
      summary: 使用邮件令牌重置密码并撤销全部刷新会话
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' } } } }
      responses: { '204': { description: 已重置 } }
  /auth/email-verification/confirm:
    post:
      summary: 使用一次性令牌验证邮箱
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses: { '204': { description: 已验证 } }
  /admin/invitations:
    get:
      summary: 管理员读取邀请记录
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 邀请列表 } }
    post:
      summary: 管理员创建一次性邀请
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email }, expiresInHours: { type: integer, minimum: 1, maximum: 720 } } } } } }
      responses: { '201': { description: 邀请已创建 } }
  /plans:
    get: { summary: 获取当前用户计划, security: [{ bearerAuth: [] }], responses: { '200': { description: 计划列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PlanResponse' } } } } } } }
    post:
      summary: 创建计划；默认没有固定休息日
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanRequest' } } } }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/PlanResponse' } } } }
        '400': { description: 日期或休息日配置无效 }
        '409': { description: 幂等键冲突 }
  /plans/{planId}:
    put:
      summary: 编辑计划设置；休息日调整不移动或删除任务
      security: [{ bearerAuth: [] }]
      parameters: [{ name: planId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanRequest' } } } }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/PlanResponse' } } } }
        '400': { description: 日期或休息日配置无效 }
        '404': { description: 计划不存在或不属于当前用户 }
        '409': { description: 基础版本过期或幂等键冲突 }
  /plans/{planId}/tasks/page:
    get:
      summary: 按日期范围分页查询任务
      security: [{ bearerAuth: [] }]
      parameters: [{ name: planId, in: path, required: true, schema: { type: string } }, { name: from, in: query, required: true, schema: { type: string, format: date } }, { name: to, in: query, required: true, schema: { type: string, format: date } }]
      responses: { '200': { description: 任务分页 } }
  /mainlines:
    get: { summary: 获取顺序主线, security: [{ bearerAuth: [] }], responses: { '200': { description: 主线列表 } } }
  /time-entries:
    get: { summary: 分页查询计时流水, security: [{ bearerAuth: [] }], responses: { '200': { description: 计时分页 } } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  parameters:
    IdempotencyKey: { name: X-Idempotency-Key, in: header, required: false, description: 8 至 100 位操作键；安全重试时必须复用原键和完全相同的请求内容。, schema: { type: string, minLength: 8, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$' } }
  schemas:
    PlanRequest:
      type: object
      required: [name, startDate, endDate]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        overallTagName: { type: string, maxLength: 60, nullable: true }
        overallTagColor: { type: string, maxLength: 20, nullable: true }
        version: { type: integer, format: int64, nullable: true, description: 编辑时提交读取到的基础版本以检测并发修改 }
        restDays:
          type: array
          nullable: true
          maxItems: 7
          uniqueItems: true
          description: ISO 星期编号；1 周一至 7 周日。创建时省略或为空表示无固定休息日；更新时省略或 null 保留现有配置，空数组明确清空。
          items: { type: integer, minimum: 1, maximum: 7 }
          example: [1, 7]
    PlanResponse:
      type: object
      required: [id, name, startDate, endDate, archived, version, taskCount, completedCount, updatedAt, restDays]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        archived: { type: boolean }
        version: { type: integer, format: int64 }
        taskCount: { type: integer, format: int64 }
        completedCount: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
        restDays: { type: array, maxItems: 7, uniqueItems: true, description: 升序的每周休息日；不影响已有任务, items: { type: integer, minimum: 1, maximum: 7 } }
    RegisterRequest: { type: object, required: [email, password, displayName], properties: { email: { type: string, format: email }, password: { type: string, minLength: 10 }, displayName: { type: string, maxLength: 80 } } }
    LoginRequest: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string } } }
    EmailRequest: { type: object, required: [email], properties: { email: { type: string, format: email } } }
    ProfileRequest: { type: object, required: [displayName], properties: { displayName: { type: string, maxLength: 80 } } }
    ChangePasswordRequest: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string }, newPassword: { type: string, minLength: 10 } } }
    PasswordResetConfirmRequest: { type: object, required: [email, token, newPassword], properties: { email: { type: string, format: email }, token: { type: string }, newPassword: { type: string, minLength: 10 } } }
