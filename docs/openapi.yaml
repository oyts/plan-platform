openapi: 3.0.3
info:
  title: Plan Platform API
  version: 0.1.16
  x-roadmap-contract: ./core-api.md
  x-implementation-version: 0.1.19
  x-contract-coverage: partial
  x-current-route-and-declared-dto-index: ./openapi-current.json
  description: 本文件保留0.1.16时期的部分接口契约，不是当前0.1.19全部端点清单；AI工作台、设备提醒、日周复盘及整套模板等扩展见core-api.md和实际控制器。普通业务需Bearer Access Token，公开入口和专用授权的提醒轮询另按各自规则。客户端可为支持的普通写操作提供X-Idempotency-Key；相同用户、键和请求内容在24小时内重放已完成响应，不表示AI付费或所有接口可自动离线重试。
servers:
  - url: /api
paths:
  /health:
    get:
      summary: 公开版本和协议标识；数据库就绪状态另见 actuator health
      responses: { '200': { description: 服务标识, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, service: { type: string, example: plan-platform-api }, version: { type: string, example: 0.1.4 }, apiVersion: { type: integer, example: 1 } } } } } } }
  /auth/config:
    get:
      summary: 获取公开账号功能开关
      responses: { '200': { description: 公开账号功能开关与业务能力, content: { application/json: { schema: { type: object, properties: { registrationEnabled: { type: boolean }, planRestDaysEnabled: { type: boolean }, todoEnabled: { type: boolean }, serverVersion: { type: string }, apiVersion: { type: integer } } } } } } }
  /todos:
    get:
      summary: 查询当前用户独立待办；连续日期范围最多31天且最多2000项，超限返回400
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: deleted, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: 日期及创建时间排序的待办列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TodoResponse' } } } } }
        '400': { description: 日期范围或结果数量超限 }
    post:
      summary: 新建待办；初始未完成且未删除
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TodoCreate' } } } }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/TodoResponse' } } } }
        '400': { description: 输入无效 }
        '409': { description: 幂等键冲突 }
  /todos/{id}:
    put:
      summary: 编辑、完成、软删除或恢复待办；所有操作都必须提交基础版本
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/TodoCreate' }
                - type: object
                  required: [done, deleted, version]
                  properties:
                    done: { type: boolean }
                    deleted: { type: boolean }
                    version: { type: integer, format: int64, minimum: 0 }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/TodoResponse' } } } }
        '400': { description: 输入无效或缺少版本 }
        '404': { description: 不存在或不属于当前用户 }
        '409': { description: 基础版本过期或幂等键冲突 }
  /auth/register:
    post:
      summary: 注册账号（服务端开启注册时）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '201': { description: 已注册 } }
  /auth/login:
    post:
      summary: 邮箱密码登录并写入 HttpOnly 刷新 Cookie
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { description: 已登录 } }
  /auth/refresh:
    post:
      summary: 使用刷新 Cookie 轮换令牌
      responses: { '200': { description: 新 Access Token } }
  /auth/me:
    get: { summary: 获取当前资料, security: [{ bearerAuth: [] }], responses: { '200': { description: 当前用户 } } }
    patch:
      summary: 修改当前用户显示名称
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileRequest' } } } }
      responses: { '200': { description: 已更新 } }
  /auth/password:
    post:
      summary: 验证当前密码后修改密码并撤销全部刷新会话
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePasswordRequest' } } } }
      responses: { '204': { description: 密码已更新 } }
  /auth/password-reset/request:
    post:
      summary: 请求一次性密码重置邮件；始终返回 204 以避免邮箱枚举
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses: { '204': { description: 已受理 } }
  /auth/password-reset/confirm:
    post:
      summary: 使用邮件令牌重置密码并撤销全部刷新会话
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' } } } }
      responses: { '204': { description: 已重置 } }
  /auth/email-verification/status:
    get:
      summary: 读取本人邮箱验证和重发冷却；不发送邮件
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 私有验证状态, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, configured: { type: boolean }, verified: { type: boolean }, retryAfterSeconds: { type: integer, minimum: 0 } } } } } }
  /auth/email-verification/request:
    post:
      summary: 向本人登录邮箱发送验证邮件；无抄送，不开放注册或强制验证
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 发件服务器接受，或账号已验证；不保证收件箱投递 }
        '403': { description: 验证功能未启用 }
        '429': { description: 60秒冷却或15分钟限流，状态接口返回剩余秒数 }
        '503': { description: 邮件未被服务接受；原有效验证令牌保留 }
  /admin/operations/mail-status:
    get:
      summary: 管理员读取持久告警邮件状态计数；不发送、不返回收件人或邮件正文
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: enabled、configured与PENDING/SENDING/ACCEPTED/UNKNOWN/SUPERSEDED计数；ACCEPTED不等于收件箱投递 }
        '403': { description: 不是管理员 }
  /auth/email-verification/confirm:
    post:
      summary: 使用一次性令牌验证邮箱
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses: { '204': { description: 已验证 } }
  /admin/invitations:
    get:
      summary: 管理员读取邀请记录
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 邀请列表 } }
    post:
      summary: 管理员创建一次性邀请
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email }, expiresInHours: { type: integer, minimum: 1, maximum: 720 } } } } } }
      responses: { '201': { description: 邀请已创建 } }
  /plans:
    get: { summary: 获取当前用户计划, security: [{ bearerAuth: [] }], responses: { '200': { description: 计划列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PlanResponse' } } } } } } }
    post:
      summary: 创建计划；默认没有固定休息日
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanRequest' } } } }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/PlanResponse' } } } }
        '400': { description: 日期或休息日配置无效 }
        '409': { description: 幂等键冲突 }
  /plans/{planId}:
    put:
      summary: 编辑计划设置；休息日调整不移动或删除任务
      security: [{ bearerAuth: [] }]
      parameters: [{ name: planId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PlanRequest' } } } }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/PlanResponse' } } } }
        '400': { description: 日期或休息日配置无效 }
        '404': { description: 计划不存在或不属于当前用户 }
        '409': { description: 基础版本过期或幂等键冲突 }
  /plans/{planId}/tasks/page:
    get:
      summary: 按日期范围分页查询任务
      security: [{ bearerAuth: [] }]
      parameters: [{ name: planId, in: path, required: true, schema: { type: string } }, { name: from, in: query, required: true, schema: { type: string, format: date } }, { name: to, in: query, required: true, schema: { type: string, format: date } }]
      responses: { '200': { description: 任务分页 } }
  /mainlines:
    get:
      summary: 获取当前用户目标路线及阶段、步骤、解锁状态
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 路线列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MainlineResponse' } } } } } }
    post:
      summary: 创建目标路线；省略 executionMode 时保持旧默认顺序推进
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MainlineRequest' } } } }
      responses: { '201': { description: 已创建 }, '400': { description: 参数无效 } }
  /mainlines/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      summary: 编辑路线；省略 executionMode 保留现有规则
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MainlineRequest' } } } }
      responses: { '200': { description: 已更新 }, '400': { description: 规则无效或形成循环 }, '404': { description: 不存在或不属于当前用户 }, '409': { description: 版本过期或会锁定进行中的步骤 } }
    delete:
      summary: 路线移入回收站
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: 已移入 }, '404': { description: 不存在或不属于当前用户 } }
  /mainlines/{id}/items:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: 新增路线步骤；使用路线返回的 nextSortOrder 分配位置
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MainlineItemRequest' } } } }
      responses: { '201': { description: 已创建 }, '400': { description: 参数或依赖无效 }, '404': { description: 路线、阶段或前置步骤不可用 }, '409': { description: 位置已占用 } }
  /mainlines/items/{itemId}:
    parameters: [{ name: itemId, in: path, required: true, schema: { type: string } }]
    put:
      summary: 编辑步骤；省略 routing 保留阶段与依赖
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MainlineItemRequest' } } } }
      responses: { '200': { description: 已更新 }, '400': { description: 参数或依赖无效 }, '404': { description: 不存在或不属于当前用户 }, '409': { description: 版本、位置或进行中状态冲突 } }
    delete:
      summary: 步骤移入回收站；被有效步骤明确依赖时拒绝
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: 已移入 }, '404': { description: 不存在或不属于当前用户 }, '409': { description: 请先调整依赖步骤 } }
  /mainlines/{id}/stages:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: 创建阶段；阶段本身不限制步骤推进
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MainlineStageRequest' } } } }
      responses: { '201': { description: 已创建 }, '400': { description: 参数无效 }, '404': { description: 路线不存在或不属于当前用户 } }
  /mainlines/stages/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      summary: 编辑阶段
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MainlineStageRequest' } } } }
      responses: { '200': { description: 已更新 }, '400': { description: 参数无效 }, '404': { description: 不存在或不属于当前用户 }, '409': { description: 版本过期 } }
    delete:
      summary: 删除阶段；保留所有步骤并清空阶段归属，包含回收站步骤
      security: [{ bearerAuth: [] }]
      parameters: [{ name: version, in: query, schema: { type: integer, format: int64 } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '204': { description: 已删除 }, '404': { description: 不存在或不属于当前用户 }, '409': { description: 版本过期 } }
  /time-entries:
    get: { summary: 分页查询计时流水, security: [{ bearerAuth: [] }], responses: { '200': { description: 计时分页 } } }
  /daily/summary:
    get:
      summary: 当前用户的今日、逾期与即将到期数量；目标路线只计未归档条数，不设逾期
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 14, default: 3 } }
      responses: { '200': { description: 私有不缓存汇总，包含 date、through、plan 和 todo 的 today/overdue/upcoming、activeRoutes } }
  /daily/items:
    get:
      summary: 按实际安排日分页列出未完成事项；改期使用 deferTo，排除已完成、跳过、删除与已归档计划
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 14, default: 3 } }
        - { name: bucket, in: query, schema: { type: string, enum: [TODAY, OVERDUE, UPCOMING], default: TODAY } }
        - { name: mode, in: query, schema: { type: string, enum: [ALL, PLAN, TODO], default: ALL } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { '200': { description: 私有不缓存 PageResponse，content 每项包含 kind、id、parentId、title、parentName、dueDate、status }, '400': { description: 日期或分页无效 } }
  /daily/routes:
    get:
      summary: 分页列出当前用户未归档路线，content 包含 id、name、total、completed，无截止日期
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses: { '200': { description: 私有不缓存 PageResponse } }
  /daily/reminders:
    get:
      summary: 读取本人站内提醒设置，默认关闭且 version 为 null；不创建记录
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 私有不缓存设置, content: { application/json: { schema: { $ref: '#/components/schemas/ReminderPreference' } } } } }
    put:
      summary: 保存本人设置，启用时至少选一种事项；首次 version 为 null，之后必须匹配
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReminderPreference' } } } }
      responses: { '200': { description: 保存后设置及版本 }, '400': { description: 设置无效 }, '409': { description: 已在其他设备更新，不覆盖 } }
  /weekly/summary:
    get:
      summary: 北京时间周一至周日的当前云端统计；完成按已记录完成时间，流水按开始或补录时间归属，不推测旧待办完成日期
      security: [{ bearerAuth: [] }]
      parameters: [{ name: start, in: query, required: true, description: 必须为周一, schema: { type: string, format: date } }]
      responses: { '200': { description: 私有不缓存，字段定义见日常使用体验说明；不是冻结的历史快照 }, '400': { description: 日期无效或不是周一 } }
  /weekly/reviews:
    get:
      summary: 分页读取本人的已保存周复盘，按 weekStart 降序
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses: { '200': { description: 私有不缓存 PageResponse，content 为 WeeklyReview } }
  /weekly/reviews/{start}:
    parameters: [{ name: start, in: path, required: true, description: 必须为周一, schema: { type: string, format: date } }]
    get:
      summary: 读取本人某周复盘；未保存时返回空文字及 null 版本，不创建记录
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 私有不缓存复盘, content: { application/json: { schema: { $ref: '#/components/schemas/WeeklyReview' } } } } }
    put:
      summary: 保存本人的周复盘，不生成或修改业务任务；首次 version 为 null，后续必须匹配
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WeeklyReview' } } } }
      responses: { '200': { description: 保存后复盘 }, '400': { description: 日期或长度无效 }, '409': { description: 其他设备已修改，保留用户草稿 } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  parameters:
    IdempotencyKey: { name: X-Idempotency-Key, in: header, required: false, description: 8 至 100 位操作键；安全重试时必须复用原键和完全相同的请求内容。, schema: { type: string, minLength: 8, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$' } }
  schemas:
    MainlineRequest:
      type: object
      required: [name, color]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000, nullable: true }
        color: { type: string, maxLength: 20 }
        version: { type: integer, format: int64, nullable: true }
        executionMode: { type: string, enum: [SEQUENTIAL, FLEXIBLE], nullable: true }
    MainlineStageRequest:
      type: object
      required: [name, sortOrder]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000, nullable: true }
        sortOrder: { type: integer, minimum: 0 }
        version: { type: integer, format: int64, nullable: true }
    MainlineRouting:
      type: object
      required: [dependencyMode]
      description: 仅 EXPLICIT 可提交非空依赖列表；ID 必须为同路线有效步骤，不能自身依赖或形成循环
      properties:
        stageId: { type: string, nullable: true }
        dependencyMode: { type: string, enum: [INHERIT, NONE, EXPLICIT] }
        prerequisiteIds: { type: array, maxItems: 100, nullable: true, items: { type: string, maxLength: 36 } }
    MainlineItemRequest:
      type: object
      required: [title, plannedMinutes, sortOrder]
      properties:
        title: { type: string, maxLength: 180 }
        description: { type: string, maxLength: 2000, nullable: true }
        acceptance: { type: array, nullable: true, items: { type: string, minLength: 1, maxLength: 500 } }
        plannedMinutes: { type: integer, minimum: 1 }
        sortOrder: { type: integer, minimum: 0 }
        version: { type: integer, format: int64, nullable: true }
        routing: { allOf: [{ $ref: '#/components/schemas/MainlineRouting' }], nullable: true }
    MainlineResponse:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        color: { type: string }
        version: { type: integer, format: int64 }
        completed: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        executionMode: { type: string, enum: [SEQUENTIAL, FLEXIBLE] }
        nextSortOrder: { type: integer }
        stages:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/MainlineStageRequest' }
              - { type: object, properties: { id: { type: string } } }
        items:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/MainlineItemRequest' }
              - type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [PENDING, RUNNING, PAUSED, COMPLETED, PARTIAL, SKIPPED, DEFERRED] }
                  unlocked: { type: boolean }
                  accumulatedSeconds: { type: integer, format: int64 }
                  note: { type: string, nullable: true }
                  startedAt: { type: string, format: date-time, nullable: true }
                  completedAt: { type: string, format: date-time, nullable: true }
                  stageId: { type: string, nullable: true }
                  dependencyMode: { type: string, enum: [INHERIT, NONE, EXPLICIT] }
                  prerequisiteIds: { type: array, items: { type: string } }
                  blockers: { type: array, items: { type: string } }
    PlanRequest:
      type: object
      required: [name, startDate, endDate]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        overallTagName: { type: string, maxLength: 60, nullable: true }
        overallTagColor: { type: string, maxLength: 20, nullable: true }
        version: { type: integer, format: int64, nullable: true, description: 编辑时提交读取到的基础版本以检测并发修改 }
        restDays:
          type: array
          nullable: true
          maxItems: 7
          uniqueItems: true
          description: ISO 星期编号；1 周一至 7 周日。创建时省略或为空表示无固定休息日；更新时省略或 null 保留现有配置，空数组明确清空。
          items: { type: integer, minimum: 1, maximum: 7 }
          example: [1, 7]
    PlanResponse:
      type: object
      required: [id, name, startDate, endDate, archived, version, taskCount, completedCount, updatedAt, restDays]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        archived: { type: boolean }
        version: { type: integer, format: int64 }
        taskCount: { type: integer, format: int64 }
        completedCount: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
        restDays: { type: array, maxItems: 7, uniqueItems: true, description: 升序的每周休息日；不影响已有任务, items: { type: integer, minimum: 1, maximum: 7 } }
    TodoCreate:
      type: object
      required: [title, dueDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        note: { type: string, maxLength: 2000, nullable: true }
        dueDate: { type: string, format: date }
    TodoResponse:
      allOf:
        - { $ref: '#/components/schemas/TodoCreate' }
        - type: object
          required: [id, done, deleted, version, updatedAt]
          properties:
            id: { type: string }
            done: { type: boolean }
            deleted: { type: boolean }
            version: { type: integer, format: int64 }
            updatedAt: { type: string, format: date-time }
    ReminderPreference:
      type: object
      required: [enabled, includePlans, includeTodos, showOverdue, lookAheadDays]
      properties:
        enabled: { type: boolean, default: false }
        includePlans: { type: boolean, default: true }
        includeTodos: { type: boolean, default: true }
        showOverdue: { type: boolean, default: true }
        lookAheadDays: { type: integer, minimum: 1, maximum: 14, default: 3 }
        version: { type: integer, format: int64, minimum: 0, nullable: true }
    WeeklyReview:
      type: object
      properties:
        weekStart: { type: string, format: date, readOnly: true }
        wins: { type: string, maxLength: 4000 }
        blockers: { type: string, maxLength: 4000 }
        nextFocus: { type: string, maxLength: 4000 }
        version: { type: integer, format: int64, minimum: 0, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true, readOnly: true }
    RegisterRequest: { type: object, required: [email, password, displayName], properties: { email: { type: string, format: email }, password: { type: string, minLength: 10 }, displayName: { type: string, maxLength: 80 } } }
    LoginRequest: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string } } }
    EmailRequest: { type: object, required: [email], properties: { email: { type: string, format: email } } }
    ProfileRequest: { type: object, required: [displayName], properties: { displayName: { type: string, maxLength: 80 } } }
    ChangePasswordRequest: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string }, newPassword: { type: string, minLength: 10 } } }
    PasswordResetConfirmRequest: { type: object, required: [email, token, newPassword], properties: { email: { type: string, format: email }, token: { type: string }, newPassword: { type: string, minLength: 10 } } }
