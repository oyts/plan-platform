# Explicit opt-in only after isolated acceptance and read-only mount verification.
# No key value belongs in Compose or environment variables.
services:
  backend:
    environment:
      AI_ENABLED: "true"
      AI_API_KEY_FILE: /run/secrets/deepseek-api-key
      AI_MODEL: deepseek-flash
      AI_MAX_INPUT_CHARS: "16000"
      AI_MAX_OUTPUT_TOKENS: "4096"
      AI_MAX_CONCURRENT: "1"
      AI_QUEUE_CAPACITY: "2"
      AI_TIMEOUT_SECONDS: "60"
    volumes:
      - type: bind
        source: /etc/plan-platform-ai/deepseek-api-key
        target: /run/secrets/deepseek-api-key
        read_only: true
        bind:
          create_host_path: false
