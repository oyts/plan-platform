# Optional overlay only. No secret file is needed while AI is disabled.
# The host file must already exist and be readable by the backend container user.
services:
  backend:
    environment:
      AI_API_KEY_FILE: /run/secrets/deepseek-api-key
    volumes:
      - type: bind
        source: ${AI_SECRET_HOST_FILE:?Set an absolute path to the restricted existing key file}
        target: /run/secrets/deepseek-api-key
        read_only: true
        bind:
          create_host_path: false
